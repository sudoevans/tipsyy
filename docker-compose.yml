services:
  postgres:
    image: postgres:17-alpine
    container_name: tipsy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tipsy
      POSTGRES_USER: tipsy
      POSTGRES_PASSWORD: tipsy_local_password
    ports:
      - "5432:5432"
    volumes:
      - tipsy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tipsy -d tipsy"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  tipsy_postgres_data:

