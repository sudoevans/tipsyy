name: Checks and deploy

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build Cloudflare Worker for pull requests
        if: github.event_name == 'pull_request'
        run: npm run build:cloudflare

      - name: Scan source for TODOs and FIXMEs
        if: always()
        shell: bash
        run: |
          if git grep -n -E 'TODO|FIXME|XXX' -- src db/migrations; then
            echo "The scan found follow-up markers; review the matches in this job log." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No TODO, FIXME, or XXX markers found in source or migrations." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Cloudflare deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under GitHub repository Actions secrets." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm run deploy
